name: Build Android release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-release-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-release-apk.yml"

     

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Install JavaScript dependencies
        run: npm ci

      - name: Assemble release APK
        run: ./android/gradlew -p android assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30


  aws-device-farm-fuzz-test:
    name: AWS Device Farm fuzz test
    needs: build-release-apk
    # Do not expose AWS credentials to pull requests from forks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-release-apk
          path: apk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Device Farm infrastructure
        working-directory: infra/device-farm
        run: |
          terraform init
          terraform validate
          terraform plan 
          terraform apply -auto-approve

      - name: Submit APK to the asynchronous Device Farm queue
        run: |
          set -euo pipefail

          input_bucket="$(terraform -chdir=infra/device-farm output -raw device_farm_input_bucket)"
          object_key="releases/${GITHUB_SHA}/${GITHUB_RUN_ID}/app-release.apk"

          aws s3 cp apk/app-release.apk "s3://${input_bucket}/${object_key}"

          {
            echo "### Device Farm test submitted"
            echo
            echo "APK: \`s3://${input_bucket}/${object_key}\`"
            echo
            echo "The S3 upload triggered SQS and the runner Lambda. Results and logs will be sent by email after testing completes."
          } >> "$GITHUB_STEP_SUMMARY"
